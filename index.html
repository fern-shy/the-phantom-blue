<html lang="en">
<head>
<meta charset="utf-8">
<title>the phantom blue</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root { --m:10px; --bar:56px; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { height:100%; margin:0; background:#000; color:#000; cursor:default;
    font:11px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif; letter-spacing:.02em;
    -webkit-user-select:none; user-select:none; overflow:hidden; }
  #gate { position:fixed; inset:0; background:#fff; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:28px; }
  #gate h1 { margin:0; font-weight:400; font-size:20px; letter-spacing:.02em; }
  #gate-actions { display:flex; gap:12px; }
  #gate button, #gate .gate-btn { all:unset; display:inline-block; cursor:pointer; padding:10px 30px; border:1px solid #000; }
  #gate button:hover, #gate .gate-btn:hover { background:#000; color:#fff; }
  #wall { position:fixed; left:50%; top:calc((100vh - var(--bar)) / 2); transform:translate(-50%,-50%);
    width:min(calc(100vw - 2 * var(--m)), calc(100vh - var(--bar) - 2 * var(--m)));
    aspect-ratio:1; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    background:#fff var(--gate) center/100% 100% no-repeat; }
  .tile { position:relative; overflow:hidden; cursor:default; }
  .tile.empty { cursor:pointer; }
  .tile::before { content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
    border-right:1px solid rgba(0,0,0,.4); border-bottom:1px solid rgba(0,0,0,.4); }
  .tile.over { background:#000; color:#fff; }
  .tile .n { position:absolute; left:6px; top:5px; }
  .tile .name { position:absolute; left:6px; right:6px; bottom:5px; width:fit-content; max-width:calc(100% - 12px);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile .n, .tile .name { z-index:1; background:#fff; padding:0 3px; }
  .tile .n:empty, .tile .name:empty { display:none; }
  /* a sounding zone inverts its own slice of the gate, full height, ending at the playhead */
  .tile .fill { position:absolute; inset:0; background:var(--gate) no-repeat; background-size:300% 300%;
    filter:invert(1); clip-path:inset(0 100% 0 0); opacity:0; pointer-events:none; transition:none; }
  #bar { position:fixed; left:0; right:0; bottom:0; height:var(--bar); background:#fff; padding:0 14px;
    display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; }
  #dock { grid-column:2; display:flex; gap:14px; align-items:center; }
  /* the four sliders live inside the control button and splay out sideways when it is on.
     max-width is measured in JS on toggle so the splay is exact at any window size */
  #controls { display:flex; gap:12px; align-items:center; overflow:hidden; max-width:0; opacity:0;
    margin-right:-14px; transition:max-width .45s cubic-bezier(.2,.8,.2,1), margin-right .45s, opacity .25s; }
  #controls.open { opacity:1; margin-right:0; }
  #bar label { display:flex; gap:6px; align-items:center; white-space:nowrap; }
  #bar input[type=range] { width:72px; accent-color:#000; cursor:default; }
  #bar button { all:unset; cursor:pointer; padding:3px 10px; border:1px solid #000; }
  #bar button.on { background:#000; color:#fff; }
  #drift, #delay { touch-action:none; }
  #bar button#rec { width:12px; height:12px; padding:0; border-radius:50%; border-color:#d10f0f; background:transparent; }
  #bar button#rec.on { background:#e10600; box-shadow:0 0 0 3px rgba(225,6,0,.28); }
  #leash { position:fixed; left:0; top:0; height:1px; background:#fff; transform-origin:0 50%;
    pointer-events:none; z-index:6; mix-blend-mode:difference; }
  #msg { grid-column:3; justify-self:end; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @media (max-width:820px) {
    #controls { gap:8px; }
    #bar input[type=range] { width:28px; }
    #msg { display:none; }
  }

<body>
<div id="gate">
  <h1>the phantom blue</h1>
  <div id="gate-actions">
    <button id="go">enter</button>
    <button id="load">load</button>
  </div>
</div>
<div id="wall"></div>
<div id="bar">
  <div id="dock">
    <button id="control" aria-expanded="false">control</button>
    <div id="controls">
      <label>master <input id="master" type="range" min="0" max="1" step=".01" value=".8"></label>
      <label>tone <input id="tone" type="range" min="0" max="1" step=".01" value="1"></label>
      <label>swell <input id="swell" type="range" min="1" max="20" step=".5" value="20"></label>
      <label>release <input id="rel" type="range" min="1" max="20" step=".5" value="20"></label>
    </div>
    <button id="reverse">reverse</button>
    <button id="delay">delay</button>
    <button id="drift">drift</button>
    <button id="hush">hush [space]</button>
    <button id="rec" aria-label="record"></button>
  </div>
  <span id="msg"></span>
</div>
<div id="leash" hidden></div>
<input id="file" type="file" accept="audio/*,.wav,.aif,.aiff,.mp3,.m4a,.aac,.flac,.ogg,.opus" multiple hidden>
<script src="lamejs.js"></script>
<script>
(function () {
  'use strict';
  var N = 9, ctx, master, lp, hushG, dryG, wetG, fbG, delayN, recDest, tiles = [], hovered = -1, pinned = -1, hushed = false, drift = false, lastMove = 0, fileAt = 0;
  var swell = 20, rel = 20, reversed = false, delayOn = false, delaySec = 0.125, wall = document.getElementById('wall'), msg = document.getElementById('msg');
  var recorder = null, recChunks = [];
  var STOCK = [
    '01 allegory.mp3', '02 sake.mp3', '03 formulaic.mp3',
    '04 magician.mp3', '05 nashville.mp3', '06 triptych.mp3',
    '07 remiss.mp3', '08 onthou.mp3', '09 ephemera.mp3'
  ];
  var driftMs = 22000, driftIdle = true, driftNext = 0, pull = null;
  var DRIFT_SLOW = 28000, DRIFT_FAST = 40, DRIFT_REACH = 260;
  var BPM = 120, BEAT = 60 / BPM, DELAY_16 = BEAT / 4, DELAY_4 = BEAT * 16, DELAY_REACH = 260;

  function say(t) { msg.textContent = t; clearTimeout(say.t); say.t = setTimeout(function () { msg.textContent = ''; }, 5000); }

  // build tiles
  for (var i = 0; i < N; i++) (function (i) {
    var el = document.createElement('div'); el.className = 'tile empty';
    el.innerHTML = '<i class="fill"></i><span class="n"></span><span class="name"></span>';
    var fill = el.querySelector('.fill');
    // the fill holds the gate at 3x, offset to this cell, so its copy registers with the gate behind it
    fill.style.backgroundPosition = (i % 3) * 50 + '% ' + Math.floor(i / 3) * 50 + '%';
    var t = { el: el, fill: fill, buf: null, src: null, gain: null, lvl: 0, target: 0, dur: 0, t0: 0, off: 0 };
    tiles.push(t); wall.appendChild(el);
    el.addEventListener('pointermove', function () { lastMove = performance.now(); });
    el.addEventListener('pointerenter', function () { hovered = i; lastMove = performance.now(); retarget(); });
    el.addEventListener('dragover', function (e) { e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', function () { el.classList.remove('over'); });
    el.addEventListener('drop', function (e) {
      e.preventDefault(); e.stopPropagation(); el.classList.remove('over');
      load([].slice.call(e.dataTransfer.files), i);
    });
    el.addEventListener('click', function (e) {
      if (e.detail > 1) return; // the follow-up of a double-click is handled below
      if (!t.buf) {
        if (!ctx) start();
        fileAt = i; $('file').click();
        return;
      }
      pinned = pinned === i ? -1 : i;
      hovered = i; lastMove = performance.now();
      retarget();
    });
    el.addEventListener('dblclick', function () { clearTile(i); });
  })(i);
  // never let a stray drop navigate away
  ['dragover', 'drop'].forEach(function (n) { window.addEventListener(n, function (e) { e.preventDefault(); }); });

  function audioFiles(list) {
    return [].slice.call(list).filter(function (f) {
      return /^audio\//.test(f.type) || /\.(wav|aiff?|mp3|m4a|aac|flac|ogg|opus)$/i.test(f.name);
    }).sort(function (a, b) { return a.name.localeCompare(b.name, undefined, { numeric: true }); });
  }
  function start() {
    if (ctx) { document.getElementById('gate').hidden = true; return; }
    var AC = window.AudioContext || window.webkitAudioContext; ctx = new AC();
    ctx.resume();
    lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = .5; lp.frequency.value = 20000;
    hushG = ctx.createGain(); master = ctx.createGain(); master.gain.value = .64;
    dryG = ctx.createGain(); wetG = ctx.createGain(); wetG.gain.value = 0;
    fbG = ctx.createGain(); fbG.gain.value = 0;
    delayN = ctx.createDelay(12); delayN.delayTime.value = DELAY_16;
    var lim = ctx.createDynamicsCompressor(); lim.threshold.value = -3; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = .003; lim.release.value = .25;
    lp.connect(hushG); hushG.connect(master);
    master.connect(dryG); master.connect(delayN); delayN.connect(wetG); delayN.connect(fbG); fbG.connect(delayN);
    dryG.connect(lim); wetG.connect(lim); lim.connect(ctx.destination);
    recDest = ctx.createMediaStreamDestination(); lim.connect(recDest);
    document.getElementById('gate').hidden = true;
  }
  async function loadStock() {
    start();
    for (var i = 0; i < STOCK.length && i < N; i++) {
      try {
        say('decoding ' + STOCK[i] + '…');
        var res = await fetch(encodeURI(STOCK[i]));
        if (!res.ok) throw new Error();
        var buf = await decode(await res.arrayBuffer());
        setTile(i, buf, STOCK[i].replace(/\.[^.]+$/, ''));
        say('');
      } catch (e) { say("can't load the bundled set — serve the folder or use the hosted page"); break; }
    }
  }
  document.getElementById('go').onclick = start;
  document.getElementById('load').onclick = loadStock;
  document.getElementById('file').onchange = function () {
    if (!this.files.length) return;
    if (!ctx) start();
    load([].slice.call(this.files), fileAt);
    this.value = '';
  };

  function decode(buf) {
    return new Promise(function (ok, no) { var p = ctx.decodeAudioData(buf, ok, no); if (p && p.catch) p.catch(no); });
  }
  async function load(files, at) {
    files = audioFiles(files);
    var idx = at;
    for (var k = 0; k < files.length; k++) {
      if (k > 0) { idx = -1; for (var j = 1; j <= N; j++) { var c = (at + j) % N; if (!tiles[c].buf) { idx = c; break; } } if (idx < 0) { say('no empty tiles left'); break; } }
      try {
        say('decoding ' + files[k].name + '…');
        var buf = await decode(await files[k].arrayBuffer());
        setTile(idx, buf, files[k].name.replace(/\.[^.]+$/, ''));
        say('');
      } catch (e) { say("can't read " + files[k].name + ' (try wav/mp3/m4a/flac)'); }
    }
  }
  function reverseBuffer(buf) {
    var rev = ctx.createBuffer(buf.numberOfChannels, buf.length, buf.sampleRate);
    for (var c = 0; c < buf.numberOfChannels; c++) {
      var a = buf.getChannelData(c), b = rev.getChannelData(c), n = a.length;
      for (var i = 0; i < n; i++) b[i] = a[n - 1 - i];
    }
    return rev;
  }
  function bufPos(t) { return (t.off + (ctx.currentTime - t.t0)) % t.dur; }
  function playBuf(t, buf, at, rev) {
    if (t.src) { try { t.src.stop(); t.src.disconnect(); } catch (e) {} }
    var s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.connect(t.gain);
    at = ((at % t.dur) + t.dur) % t.dur;
    s.start(0, at); t.src = s; t.buf = buf; t.off = at; t.t0 = ctx.currentTime; t.playRev = rev;
  }
  function setTile(i, buf, name) {
    clearTile(i);
    var t = tiles[i], g = ctx.createGain(); g.gain.value = 0; g.connect(lp);
    t.gain = g; t.fwd = buf; t.revBuf = null; t.dur = buf.duration; t.lvl = 0; t.target = 0;
    playBuf(t, reversed ? reverseBuffer(buf) : buf, Math.random() * buf.duration, reversed);
    if (reversed) t.revBuf = t.buf;
    t.el.classList.remove('empty'); t.el.querySelector('.n').textContent = '0' + (i + 1);
    t.el.querySelector('.name').textContent = name + '  ' + Math.floor(buf.duration / 60) + ':' + ('0' + Math.round(buf.duration % 60)).slice(-2);
    retarget();
  }
  function clearTile(i) {
    var t = tiles[i]; if (!t.src) return;
    try { t.src.stop(); t.src.disconnect(); t.gain.disconnect(); } catch (e) {}
    t.src = t.gain = t.buf = t.fwd = t.revBuf = null; t.lvl = 0; t.target = 0; t.playRev = false;
    t.el.classList.add('empty'); t.el.classList.remove('main'); t.fill.style.opacity = 0;
    t.el.querySelector('.name').textContent = ''; t.el.querySelector('.n').textContent = '';
    if (pinned === i) pinned = -1;
  }
  function flipReverse() {
    if (!ctx) return;
    reversed = !reversed; $('reverse').classList.toggle('on', reversed);
    tiles.forEach(function (t) {
      if (!t.src || !t.fwd) return;
      var here = bufPos(t);
      var orig = t.playRev ? (t.dur - here) : here;
      if (reversed && !t.revBuf) t.revBuf = reverseBuffer(t.fwd);
      playBuf(t, reversed ? t.revBuf : t.fwd, reversed ? (t.dur - orig) : orig, reversed);
    });
  }

  // loops keep running; gain is the only thing that moves.
  // no pin: last hovered loaded tile is the voice. pin: that tile is MAIN and stays up;
  // hover then blends another voice on top. click a new tile and MAIN moves, the old one releases.
  function retarget() {
    if (!ctx) return;
    var hv = hovered >= 0 && tiles[hovered].buf ? hovered : -1;
    if (hv < 0 && hovered >= 0) return; // empty tile: don't steal the hover voice
    tiles.forEach(function (t, i) {
      if (!t.gain) return;
      var on = i === pinned || i === hv; t.target = on ? 1 : 0;
      t.el.classList.toggle('main', i === pinned);
      t.fill.style.opacity = on ? 1 : 0;
      var rapid = (drift && !driftIdle) || (pull && pull.kind === 'drift');
      var tau = (i === pinned)
        ? (on ? swell : rel) / 3
        : rapid ? Math.max(.018, driftMs / 1000 * .55) : (on ? swell : rel) / 3;
      t.gain.gain.cancelScheduledValues(ctx.currentTime);
      t.gain.gain.setValueAtTime(t.lvl * t.lvl, ctx.currentTime);   // squared = gentler, more natural taper
      t.gain.gain.setTargetAtTime(t.target * t.target, ctx.currentTime, tau / 1.4);
    });
  }
  var prev = performance.now();
  (function frame(now) {
    var dt = (now - prev) / 1000; prev = now;
    tiles.forEach(function (t) {
      if (!t.gain) return;
      var tau = (t.target ? swell : rel) / 3 / 1.4 * 2; // lvl^2 follows the gain curve; lvl itself is its sqrt, so tau is doubled
      t.lvl += (t.target - t.lvl) * (1 - Math.exp(-dt / tau));
      if (Math.abs(t.lvl - t.target) < .001) t.lvl = t.target;
      var here = bufPos(t), orig = t.playRev ? (t.dur - here) : here;
      var p = orig / t.dur;
      t.fill.style.clipPath = 'inset(0 ' + ((1 - p) * 100).toFixed(2) + '% 0 0)';
    });
    if (drift && ctx && now > driftNext && ((pull && pull.kind === 'drift') || !driftIdle || now - lastMove > 8000)) {
      var skip = hovered;
      var ready = tiles.map(function (t, i) { return t.buf ? i : -1; }).filter(function (i) { return i >= 0 && i !== skip; });
      if (ready.length) { hovered = ready[Math.floor(Math.random() * ready.length)]; retarget(); }
      driftNext = now + (driftIdle && !pull ? 14000 + Math.random() * 18000 : driftMs);
    }
    requestAnimationFrame(frame);
  })(prev);

  function $(id) { return document.getElementById(id); }
  $('control').onclick = function () {
    var c = $('controls'), open = c.classList.toggle('open');
    c.style.maxWidth = open ? c.scrollWidth + 'px' : 0;
    this.classList.toggle('on', open); this.setAttribute('aria-expanded', open);
  };
  $('master').oninput = function () { if (ctx) master.gain.setTargetAtTime(this.value * this.value, ctx.currentTime, .03); };
  $('tone').oninput = function () { if (ctx) lp.frequency.setTargetAtTime(250 * Math.pow(80, +this.value), ctx.currentTime, .03); };
  $('swell').oninput = function () { swell = +this.value; };
  $('rel').oninput = function () { rel = +this.value; };
  function driftFromPull(d) {
    var t = Math.min(1, Math.max(0, (d - 12) / DRIFT_REACH));
    t = t * t; // most of the travel stays musical; the last stretch goes very fast
    return DRIFT_SLOW * Math.pow(DRIFT_FAST / DRIFT_SLOW, t);
  }
  function leashTo(x, y) {
    var L = $('leash'), dx = x - pull.x, dy = y - pull.y, d = Math.hypot(dx, dy);
    L.hidden = d < 1;
    L.style.width = d.toFixed(1) + 'px';
    L.style.transform = 'translate(' + pull.x + 'px,' + pull.y + 'px) rotate(' + Math.atan2(dy, dx) + 'rad)';
  }
  function delayFromPull(d) {
    var t = Math.min(1, Math.max(0, (d - 12) / DELAY_REACH));
    t = t * t;
    return DELAY_16 * Math.pow(DELAY_4 / DELAY_16, t);
  }
  function applyDelay(on, seconds) {
    if (!ctx) return;
    if (seconds) delaySec = Math.min(DELAY_4, Math.max(DELAY_16, seconds));
    delayOn = on;
    var now = ctx.currentTime;
    dryG.gain.setTargetAtTime(on ? 0 : 1, now, .02);
    wetG.gain.setTargetAtTime(on ? 1 : 0, now, .02);
    fbG.gain.setTargetAtTime(on ? .72 : 0, now, .02);
    if (on) delayN.delayTime.setTargetAtTime(delaySec, now, .03);
    $('delay').classList.toggle('on', on);
  }
  function armPull(el, kind, onDrag, onClick) {
    el.addEventListener('pointerdown', function (e) {
      if (e.button) return;
      e.preventDefault();
      this.setPointerCapture(e.pointerId);
      var r = this.getBoundingClientRect();
      pull = { x: r.left + r.width / 2, y: r.top + r.height / 2, dragged: false, id: e.pointerId, kind: kind, el: this };
    });
    el.addEventListener('pointermove', function (e) {
      if (!pull || pull.el !== this || e.pointerId !== pull.id) return;
      var d = Math.hypot(e.clientX - pull.x, e.clientY - pull.y);
      if (d > 8) pull.dragged = true;
      if (!pull.dragged) return;
      onDrag(d); leashTo(e.clientX, e.clientY);
    });
    function end(e) {
      if (!pull || pull.el !== this || (e && e.pointerId !== pull.id)) return;
      if (!pull.dragged) onClick();
      $('leash').hidden = true; pull = null;
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }
  armPull($('drift'), 'drift', function (d) {
    drift = true; driftIdle = false; driftMs = driftFromPull(d);
    $('drift').classList.add('on');
    driftNext = Math.min(driftNext, performance.now());
  }, function () {
    drift = !drift; driftIdle = true; driftMs = DRIFT_SLOW;
    $('drift').classList.toggle('on', drift); lastMove = performance.now();
  });
  armPull($('delay'), 'delay', function (d) {
    if (!ctx) start();
    applyDelay(true, delayFromPull(d));
  }, function () {
    if (!ctx) start();
    applyDelay(!delayOn);
  });
  $('reverse').onclick = flipReverse;
  function slugNow() {
    var d = new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }
  var saving = false, MP3_KBPS = 96;
  function saveFile(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    say('saved ' + name);
  }
  function pcm16(ch, start, len) {
    var out = new Int16Array(1152);
    for (var i = 0; i < len; i++) {
      var s = ch[start + i];
      if (s > 1) s = 1; else if (s < -1) s = -1;
      out[i] = s < 0 ? s * 32768 : s * 32767;
    }
    return out;
  }
  function encodeMp3(buffer) {
    return new Promise(function (ok, no) {
      try {
        var channels = Math.min(2, buffer.numberOfChannels);
        var enc = new lamejs.Mp3Encoder(channels, buffer.sampleRate, MP3_KBPS);
        var left = buffer.getChannelData(0);
        var right = channels > 1 ? buffer.getChannelData(1) : null;
        var parts = [], i = 0, block = 1152;
        (function step() {
          try {
            var n = 0;
            while (i < left.length && n < 400) {
              var len = Math.min(block, left.length - i);
              var buf = right ? enc.encodeBuffer(pcm16(left, i, len), pcm16(right, i, len)) : enc.encodeBuffer(pcm16(left, i, len));
              if (buf.length) parts.push(buf);
              i += block; n++;
            }
            if (i < left.length) { setTimeout(step, 0); return; }
            var end = enc.flush();
            if (end.length) parts.push(end);
            ok(new Blob(parts, { type: 'audio/mpeg' }));
          } catch (e) { no(e); }
        })();
      } catch (e) { no(e); }
    });
  }
  function toggleRec() {
    if (!ctx || saving) return;
    if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
    recChunks = [];
    var types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
    var mime = '';
    for (var i = 0; i < types.length; i++) if (window.MediaRecorder && MediaRecorder.isTypeSupported(types[i])) { mime = types[i]; break; }
    var opts = mime ? { mimeType: mime, audioBitsPerSecond: MP3_KBPS * 1000 } : { audioBitsPerSecond: MP3_KBPS * 1000 };
    try { recorder = new MediaRecorder(recDest.stream, opts); }
    catch (e) { recorder = mime ? new MediaRecorder(recDest.stream, { mimeType: mime }) : new MediaRecorder(recDest.stream); }
    recorder.ondataavailable = function (e) { if (e.data && e.data.size) recChunks.push(e.data); };
    recorder.onstop = function () {
      var type = recorder.mimeType || 'audio/webm';
      var blob = new Blob(recChunks, { type: type });
      var name = 'gateway-' + slugNow() + '.mp3';
      $('rec').classList.remove('on');
      saving = true; say('encoding…');
      blob.arrayBuffer().then(decode).then(encodeMp3).then(function (mp3) {
        saveFile(mp3, name);
      }).catch(function () {
        var ext = /mp4|m4a|aac/.test(type) ? 'm4a' : 'webm';
        saveFile(blob, name.replace(/\.mp3$/, '.' + ext));
      }).then(function () { saving = false; });
    };
    recorder.start();
    $('rec').classList.add('on');
    say('recording');
  }
  $('rec').onclick = toggleRec;
  function toggleHush() {
    if (!ctx) return; hushed = !hushed; $('hush').classList.toggle('on', hushed);
    hushG.gain.cancelScheduledValues(ctx.currentTime); hushG.gain.setTargetAtTime(hushed ? 0 : 1, ctx.currentTime, .005); // ~instant, 5ms constant avoids a click
  }
  $('hush').onclick = toggleHush;
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); toggleHush(); }
    if (e.key === 'f') document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  });
  document.addEventListener('pointerdown', function () { if (ctx && ctx.state !== 'running') ctx.resume(); });
})();
</script>
</body>
